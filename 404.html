<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found &mdash; Ordo Animi</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{
  --ink:#0b0e11;
  --paper:#faf7ef;         --paper-rgb:250,247,239;
  --surface-2:#ebe4d2;
  --theme-color:#b8924e;
  --gilt-light:#d4b36a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
.wrap{max-width:480px}
.code{font-family:'DM Sans',monospace;font-size:0.85rem;letter-spacing:0.14em;color:var(--gilt-light);margin-bottom:1rem}
h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(1.8rem,5vw,2.6rem);margin-bottom:1rem}
p{color:var(--surface-2);line-height:1.6;margin-bottom:2rem}
a.btn{display:inline-block;padding:0.8rem 1.6rem;border-radius:6px;font-weight:600;background:var(--theme-color);color:var(--ink);text-decoration:none}
a.btn:hover{background:var(--gilt-light)}
a.btn:focus-visible{outline:3px solid var(--theme-color);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <p class="code">404</p>
  <h1>This page doesn&rsquo;t exist.</h1>
  <p>The page you&rsquo;re looking for has moved or never did. Head back to the homepage.</p>
  <a class="btn" href="/">Return to Ordo Animi</a>
</div>
</body>
